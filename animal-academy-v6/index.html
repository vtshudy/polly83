<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071812">
<title>Creature Quest Academy v6.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#071812;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;overflow:hidden;background:#10281f}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;gap:9px;align-items:center;pointer-events:none}
.hudOrb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid rgba(235,255,247,.9);background:linear-gradient(180deg,rgba(7,117,91,.92),rgba(3,63,57,.92));box-shadow:0 0 0 3px rgba(0,25,33,.45),0 7px 18px rgba(0,0,0,.26),inset 0 2px rgba(255,255,255,.16)}
.hudOrb svg{width:33px;height:33px;fill:#c9ffe0;stroke:#063b35;stroke-width:2}
#dataLights{height:52px;padding:0 12px;border-radius:28px;display:flex;gap:8px;align-items:center;border:3px solid rgba(235,255,247,.9);background:linear-gradient(180deg,rgba(7,117,91,.92),rgba(3,63,57,.92));box-shadow:0 0 0 3px rgba(0,25,33,.45),0 7px 18px rgba(0,0,0,.26),inset 0 2px rgba(255,255,255,.16)}
.light{width:23px;height:23px;border-radius:50%;border:3px solid #dfffee;background:#0b423f;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
.light.on{background:radial-gradient(circle,#fff 0 13%,#67ff97 17% 53%,#1dbb68 57%,#086141 62%);box-shadow:0 0 13px #63ff97,inset 0 0 0 3px rgba(0,0,0,.15)}
#pause{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:30;width:52px;height:52px;border-radius:50%;border:3px solid rgba(235,255,247,.9);background:linear-gradient(180deg,rgba(7,117,91,.92),rgba(3,63,57,.92));box-shadow:0 0 0 3px rgba(0,25,33,.45),0 7px 18px rgba(0,0,0,.26);padding:0}
#pause:before,#pause:after{content:"";position:absolute;top:13px;width:6px;height:22px;border-radius:3px;background:#fff}
#pause:before{left:16px}#pause:after{right:16px}
#controls{position:fixed;inset:0;z-index:30;pointer-events:none}
#dpad{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(8,84,95,.16),rgba(0,25,34,.28));box-shadow:inset 0 0 0 2px rgba(255,255,255,.10);pointer-events:none}
.dir{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid rgba(239,255,250,.34);background:linear-gradient(180deg,rgba(12,99,126,.56),rgba(3,55,76,.56));box-shadow:0 6px 15px rgba(0,0,0,.27),inset 0 1px rgba(255,255,255,.12);pointer-events:auto}
.dir:after{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;border-left:5px solid #fff;border-bottom:5px solid #fff;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
#up{left:49px;top:0}#up:after{transform:translate(-50%,-35%) rotate(135deg)}
#down{left:49px;bottom:0}#down:after{transform:translate(-50%,-65%) rotate(-45deg)}
#left{left:0;top:49px}#left:after{transform:translate(-35%,-50%) rotate(45deg)}
#right{right:0;top:49px}#right:after{transform:translate(-65%,-50%) rotate(-135deg)}
#action{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:102px;height:102px;border-radius:50%;border:4px solid rgba(246,255,247,.48);background:radial-gradient(circle at 34% 24%,#e6ffba,#72ff79 34%,#28d757 60%,#129447 100%);box-shadow:0 0 0 4px rgba(9,75,95,.32),0 10px 22px rgba(0,0,0,.34),inset 0 4px 10px rgba(255,255,255,.35);pointer-events:auto}
#action svg{width:52px;height:52px;fill:#fff7a3;stroke:#16482d;stroke-width:4;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,13,16,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#overlay.show{display:flex}
.card{width:min(720px,100%);max-height:88vh;overflow:auto;padding:20px;border-radius:26px;color:#fff;background-color:#073f51;background-image:linear-gradient(rgba(104,255,165,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(104,255,165,.07) 1px,transparent 1px),radial-gradient(circle at 50% 0,rgba(78,218,255,.20),transparent 42%);background-size:22px 22px,22px 22px,auto;border:3px solid #d8fff0;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.card h2{margin:0 0 12px;font-size:clamp(24px,4vw,36px);line-height:1.08}
.card p{line-height:1.45}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:58px;border:3px solid #102025;border-radius:16px;background:#fff;color:#102025;font-weight:900;padding:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.choice.good{background:#a2f6ac}.choice.bad{background:#ff9da8}
@media(max-width:700px){.choices{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div id="game"><canvas id="world"></canvas></div>
<div id="hud">
  <div class="hudOrb" aria-hidden="true">
    <svg viewBox="0 0 64 64"><circle cx="21" cy="20" r="8"/><circle cx="43" cy="20" r="8"/><circle cx="14" cy="36" r="7"/><circle cx="50" cy="36" r="7"/><path d="M21 47c0-10 6-17 11-17s11 7 11 17c0 7-5 11-11 11S21 54 21 47Z"/></svg>
  </div>
  <div id="dataLights"><i class="light"></i><i class="light"></i><i class="light"></i></div>
</div>
<button id="pause" aria-label="Pause"></button>
<div id="controls">
  <div id="dpad"><button id="up" class="dir" aria-label="Jump"></button><button id="down" class="dir" aria-label="Down"></button><button id="left" class="dir" aria-label="Move left"></button><button id="right" class="dir" aria-label="Move right"></button></div>
  <button id="action" aria-label="Action"><svg viewBox="0 0 64 64"><path d="M36 3 13 36h17l-3 25 24-35H34Z"/></svg></button>
</div>
<div id="overlay"><div id="card" class="card"></div></div>
<script>
"use strict";
const canvas=document.getElementById("world"),ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay"),card=document.getElementById("card");
const H=720,LEVEL_W=4300,GROUND=606;
let dpr=1,viewW=1280,scale=1,last=performance.now(),camera=0,time=0;
const input={left:false,right:false,down:false};
const player={x:170,y:GROUND-126,w:72,h:126,vx:0,vy:0,speed:345,jump:720,onGround:false,face:1,run:0,land:0};
const state={data:0,history:[]};
try{Object.assign(state,JSON.parse(localStorage.getItem("cq_v6_state")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("cq_v6_state",JSON.stringify(state))}catch(e){}}
const platforms=[
 {x:0,y:GROUND,w:LEVEL_W,h:180},
 {x:720,y:518,w:230,h:94},{x:1045,y:454,w:245,h:118},{x:1385,y:520,w:250,h:100},
 {x:1730,y:448,w:240,h:128},{x:2100,y:392,w:225,h:140},{x:2435,y:475,w:275,h:112},
 {x:2830,y:414,w:245,h:124},{x:3185,y:350,w:265,h:145},{x:3570,y:430,w:265,h:124}
];
const entities=[
 {id:"scanner",x:475,y:GROUND-102,type:"scanner",done:false},
 {id:"frog",x:900,y:GROUND-72,type:"animal",done:false},
 {id:"toucan",x:1530,y:458,type:"animal",done:false},
 {id:"sloth",x:2240,y:327,type:"animal",done:false},
 {id:"baby",x:3740,y:365,type:"rescue",done:false}
];
const questions={
 scanner:{q:"Scanner reading: 347. Which digit is in the tens place?",a:"4",o:["3","4","7","0"],skill:"Place value: tens"},
 frog:{q:"Which word begins with wh?",a:"whale",o:["phone","whale","ring","cat"],skill:"Phonics: wh"},
 toucan:{q:"7 + 5 = ?",a:"12",o:["10","11","12","13"],skill:"Math facts: addition"},
 sloth:{q:"Which adaptation helps a sloth hang from branches?",a:"Long curved claws",o:["Long curved claws","Hooves","Fins","Feathers"],skill:"Reading: informational text"},
 baby:{q:"Which field note gives the most useful detail?",a:"The baby sloth is high in a leafy tree beside the waterfall.",o:["The sloth is there.","The baby sloth is high in a leafy tree beside the waterfall.","Sloth.","It is an animal."],skill:"Writing: add details"}
};
const ambience=Array.from({length:32},(_,i)=>({x:(i*173)%LEVEL_W,y:80+(i*71)%420,s:.55+(i%5)*.11,p:i*.7}));
const atlas=new Image();atlas.src="assets/cq_v6_texture_atlas.webp?v=62";
const AT={cliff:[0,0,256,256],bark:[256,0,256,256],foliage:[512,0,256,256],water:[0,256,256,256],stone:[256,256,256,256],vine:[512,256,256,256],ground:[0,512,256,256],grass:[256,512,512,256]};
function drawAtlasTile(name,x,y,w,h,alpha=1){
 if(!atlas.complete||!atlas.naturalWidth)return false;
 const a=AT[name];ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 const tw=name==="grass"?256:180,th=name==="grass"?128:180;
 for(let yy=y;yy<y+h;yy+=th)for(let xx=x;xx<x+w;xx+=tw)ctx.drawImage(atlas,a[0],a[1],a[2],a[3],xx,yy,tw,th);
 ctx.restore();return true
}
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 scale=canvas.height/H;viewW=canvas.width/scale;
}
addEventListener("resize",resize);resize();
function setData(n){state.data=n;document.querySelectorAll(".light").forEach((e,i)=>e.classList.toggle("on",i<n));save()}
setData(state.data||0);
function nearEntity(){let hit=null,dist=1e9;for(const e of entities){if(e.done)continue;const d=Math.abs((player.x+player.w/2)-e.x);if(d<dist){dist=d;hit=e}}return dist<125?hit:null}
function question(e){
 const q=questions[e.id],first={value:true};
 card.innerHTML='<h2>'+q.q+'</h2><div class="choices">'+q.o.map((v,i)=>'<button class="choice" data-i="'+i+'">'+v+'</button>').join("")+'</div>';
 overlay.classList.add("show");input.left=input.right=false;
 card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const s=q.o[+b.dataset.i],ok=s===q.a;
   if(first.value){state.history.push({time:new Date().toISOString(),skill:q.skill,question:q.q,selected:s,correctAnswer:q.a,isCorrect:ok});first.value=false;save()}
   if(ok){b.classList.add("good");setTimeout(()=>{overlay.classList.remove("show");e.done=true;if(e.type==="animal")setData(Math.min(3,state.data+1));if(e.type==="rescue")celebrate()},430)}
   else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),420)}
 });
}
function action(){if(overlay.classList.contains("show"))return;const e=nearEntity();if(e)question(e)}
function celebrate(){card.innerHTML='<h2>Rescue complete!</h2><p>The baby sloth is safe. Your field data and school skills helped finish the mission.</p><button class="choice" id="close">Keep exploring</button>';overlay.classList.add("show");document.getElementById("close").onclick=()=>overlay.classList.remove("show")}
function physics(dt){
 if(overlay.classList.contains("show"))return;
 player.vx=(input.right?player.speed:0)-(input.left?player.speed:0);if(player.vx)player.face=Math.sign(player.vx);
 player.vy+=1650*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(0,Math.min(LEVEL_W-player.w,player.x));player.onGround=false;
 for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+48&&player.vy>=0){if(player.vy>340)player.land=.18;player.y=p.y-player.h;player.vy=0;player.onGround=true}}
 if(player.y>H+350){player.x=170;player.y=GROUND-player.h;player.vy=0}
 if(Math.abs(player.vx)>5&&player.onGround)player.run+=dt*11;
 if(player.land>0)player.land-=dt;
 const target=Math.max(0,Math.min(LEVEL_W-viewW,player.x-viewW*.38));camera+=(target-camera)*Math.min(1,dt*6.2)
}
function jump(){if(player.onGround&&!overlay.classList.contains("show")){player.vy=-player.jump;player.onGround=false}}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function leaf(x,y,rx,ry,a,c1,c2){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);let g=ctx.createLinearGradient(-rx,0,rx,0);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(10,55,30,.25)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-rx*.7,0);ctx.lineTo(rx*.7,0);ctx.stroke();ctx.restore()
}
function canopyCluster(x,y,s,dark){
 const colors=dark?["#225b38","#347544"]:["#447e4e","#5d9657"];
 for(let i=0;i<10;i++){const a=i/10*Math.PI*2,rr=(38+(i%3)*8)*s;leaf(x+Math.cos(a)*rr*.68,y+Math.sin(a)*rr*.35,32*s,17*s,a*.4,colors[0],colors[1])}
}
function barkTrunk(x,y,w,h,c1,c2){
 ctx.save();round(x,y,w,h,18);ctx.clip();
 if(!drawAtlasTile("bark",x,y,w,h,.92)){let g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(.45,c2);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)}
 let shade=ctx.createLinearGradient(x,0,x+w,0);shade.addColorStop(0,"rgba(0,0,0,.20)");shade.addColorStop(.4,"rgba(255,220,150,.08)");shade.addColorStop(1,"rgba(0,0,0,.24)");ctx.fillStyle=shade;ctx.fillRect(x,y,w,h);ctx.restore();
 ctx.strokeStyle="rgba(55,31,22,.46)";ctx.lineWidth=4;round(x,y,w,h,18);ctx.stroke()
}
function sky(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#72d9e8");g.addColorStop(.42,"#70c5ad");g.addColorStop(1,"#4f8453");ctx.fillStyle=g;ctx.fillRect(0,0,viewW,H);
 let mist=ctx.createRadialGradient(viewW*.65,170,10,viewW*.65,170,330);mist.addColorStop(0,"rgba(244,255,235,.30)");mist.addColorStop(1,"rgba(244,255,235,0)");ctx.fillStyle=mist;ctx.fillRect(0,0,viewW,H);
 // far canopy
 ctx.save();ctx.translate(-(camera*.05)%220,0);for(let x=-260;x<viewW+400;x+=105){canopyCluster(x,260+(x%210)*.04,.9,false)}ctx.restore();
 // far trunks
 ctx.save();ctx.translate(-(camera*.13)%300,0);
 for(let x=-300;x<viewW+600;x+=145){barkTrunk(x,285,42,H-250,"#3e6444","#52794e");canopyCluster(x+21,282,1.08,true)}
 ctx.restore();
 // mid trunks & branches
 ctx.save();ctx.translate(-(camera*.22)%410,0);
 for(let x=-410;x<viewW+820;x+=205){barkTrunk(x,230,58,H-180,"#4d603b","#6b7245");ctx.fillStyle="#385f3c";ctx.beginPath();ctx.moveTo(x+22,330);ctx.lineTo(x-105,235);ctx.lineTo(x-82,218);ctx.lineTo(x+38,298);ctx.closePath();ctx.fill();canopyCluster(x+25,240,1.35,true)}
 ctx.restore();
 // hanging vines
 ctx.strokeStyle="rgba(28,100,43,.58)";ctx.lineWidth=7;for(let v=90;v<viewW+80;v+=260){const xx=v-((camera*.19)%260);ctx.beginPath();ctx.moveTo(xx,-20);ctx.bezierCurveTo(xx+32,70,xx-40,135,xx+10,225);ctx.stroke();for(let j=0;j<5;j++)leaf(xx+(j%2?8:-7),58+j*34,10,5,(j%2?.5:-.5),"#2f7f43","#4ba650")}
}
function drawGrassEdge(x,y,w){
 if(atlas.complete&&atlas.naturalWidth){
   ctx.save();ctx.beginPath();ctx.rect(x-8,y-38,w+16,54);ctx.clip();
   const a=AT.grass;for(let xx=x-8;xx<x+w+16;xx+=220)ctx.drawImage(atlas,a[0],a[1],a[2],a[3],xx,y-42,230,77);
   ctx.restore();
 }else{
   let gg=ctx.createLinearGradient(0,y-15,0,y+26);gg.addColorStop(0,"#b9ee5b");gg.addColorStop(.35,"#69bd3f");gg.addColorStop(1,"#368d36");ctx.fillStyle=gg;round(x-6,y-14,w+12,30,13);ctx.fill()
 }
}
function soilTexture(x,y,w,h){
 ctx.save();round(x,y,w,h,12);ctx.clip();
 if(!drawAtlasTile("cliff",x,y,w,h,.94)){let g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,"#9a6a42");g.addColorStop(.42,"#7b4f34");g.addColorStop(1,"#5f3b29");ctx.fillStyle=g;ctx.fillRect(x,y,w,h)}
 let shade=ctx.createLinearGradient(0,y,0,y+h);shade.addColorStop(0,"rgba(255,205,118,.08)");shade.addColorStop(1,"rgba(48,26,16,.30)");ctx.fillStyle=shade;ctx.fillRect(x,y,w,h);ctx.restore()
}
function terrain(){
 ctx.save();ctx.translate(-camera,0);
 soilTexture(0,GROUND,LEVEL_W,180);drawGrassEdge(0,GROUND,LEVEL_W);
 // scenic giant trunks
 [[570,215,124],[1840,170,146],[2725,205,130],[3920,160,145]].forEach((a,i)=>{barkTrunk(a[0],a[1],a[2],GROUND-a[1]+28,i%2?"#6f482d":"#765137",i%2?"#95613b":"#9f6e44");canopyCluster(a[0]+a[2]/2,a[1]+15,1.55,true)});
 // platforms
 for(const p of platforms.slice(1)){ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(p.x+p.w/2,p.y+p.h+15,p.w*.46,15,0,0,Math.PI*2);ctx.fill();soilTexture(p.x,p.y,p.w,p.h);drawGrassEdge(p.x,p.y,p.w)}
 // river with illustrated texture
 if(atlas.complete&&atlas.naturalWidth){const a=AT.water;ctx.drawImage(atlas,a[0],a[1],a[2],a[3],1090,GROUND-12,270,80)}
 else{let water=ctx.createLinearGradient(0,GROUND-15,0,GROUND+60);water.addColorStop(0,"#8ceaf0");water.addColorStop(.23,"#3db5c9");water.addColorStop(1,"#197f9b");ctx.fillStyle=water;ctx.fillRect(1090,GROUND-9,270,70)}
 // illustrated vine wall obstacle
 if(atlas.complete&&atlas.naturalWidth){const a=AT.vine;ctx.save();ctx.globalAlpha=.78;ctx.drawImage(atlas,a[0],a[1],a[2],a[3],2340,250,180,350);ctx.restore()}
 // logs
 [[1320,492,122],[2500,448,142]].forEach(a=>{let lg=ctx.createLinearGradient(a[0],0,a[0]+a[2],0);lg.addColorStop(0,"#6f4228");lg.addColorStop(.5,"#9a633a");lg.addColorStop(1,"#634027");ctx.fillStyle=lg;round(a[0],a[1],a[2],30,15);ctx.fill();ctx.strokeStyle="#3f2b22";ctx.lineWidth=4;ctx.stroke()});
 // rocks, ferns, flowers
 for(let x=360;x<LEVEL_W;x+=430){drawRock(x,GROUND-12,0.65+(x%3)*.12)}
 for(let x=240;x<LEVEL_W;x+=350){fern(x,GROUND-6,0.75+(x%4)*.08)}
 ctx.restore()
}
function drawRock(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(0,4,54,12,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(-47,0);ctx.lineTo(-33,-38);ctx.lineTo(-6,-58);ctx.lineTo(28,-43);ctx.lineTo(48,-7);ctx.lineTo(31,0);ctx.closePath();ctx.save();ctx.clip();
 if(atlas.complete&&atlas.naturalWidth){const a=AT.stone;ctx.drawImage(atlas,a[0],a[1],a[2],a[3],-55,-65,112,72)}else{ctx.fillStyle="#839089";ctx.fillRect(-55,-65,112,72)}
 ctx.restore();ctx.strokeStyle="#43514d";ctx.lineWidth=4;ctx.stroke();ctx.restore()
}
function fern(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle="#1d773c";ctx.lineWidth=5;ctx.lineCap="round";
 for(let i=0;i<7;i++){const a=-1.3+i*.43;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a)*30,-35,Math.cos(a)*55,Math.sin(a)*42-35);ctx.stroke();for(let j=1;j<4;j++){const px=Math.cos(a)*j*13,py=-j*8;leaf(px,py,10,4,a*.45,"#39a650","#63c455")}}
 ctx.restore()
}
function scannerArt(x,y){
 ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.24)";ctx.beginPath();ctx.ellipse(0,90,46,11,0,0,Math.PI*2);ctx.fill();
 let g=ctx.createLinearGradient(-34,0,34,0);g.addColorStop(0,"#0a2b3e");g.addColorStop(.45,"#17698b");g.addColorStop(1,"#08243a");ctx.fillStyle=g;ctx.strokeStyle="#07171d";ctx.lineWidth=5;round(-34,0,68,84,14);ctx.fill();ctx.stroke();
 ctx.fillStyle="#0b1821";round(-24,11,48,32,8);ctx.fill();ctx.stroke();ctx.fillStyle="#62ff98";round(-16,17,32,20,5);ctx.fill();ctx.shadowColor="#62ff98";ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle="#294d5e";ctx.fillRect(-25,80,50,13);ctx.strokeRect(-25,80,50,13);ctx.restore()
}
function frogArt(x,y){
 ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,42,39,9,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#12351e";ctx.lineWidth=5;ctx.fillStyle="#5de25e";ctx.beginPath();ctx.ellipse(0,15,37,28,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#69f06c";for(const ex of [-17,17]){ctx.beginPath();ctx.arc(ex,-7,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#f8fff4";ctx.beginPath();ctx.arc(ex,-7,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex,-6,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#69f06c"}
 ctx.fillStyle="#1b5cba";ctx.beginPath();ctx.arc(-12,15,6,0,Math.PI*2);ctx.arc(13,25,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ec4e91";ctx.beginPath();ctx.arc(10,9,5,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#214c2a";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-24,27);ctx.lineTo(-46,45);ctx.moveTo(24,27);ctx.lineTo(46,45);ctx.stroke();ctx.restore()
}
function toucanArt(x,y){
 ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(-2,52,34,8,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#111";ctx.lineWidth=5;ctx.fillStyle="#1c2934";ctx.beginPath();ctx.ellipse(-8,15,29,37,-.12,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#f4f2dd";ctx.beginPath();ctx.ellipse(-5,12,14,23,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ffd24a";ctx.beginPath();ctx.moveTo(12,-18);ctx.quadraticCurveTo(72,-34,62,2);ctx.quadraticCurveTo(37,19,10,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle="#e96f35";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(18,-9);ctx.quadraticCurveTo(48,-18,61,-4);ctx.stroke();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-1,-15,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(1,-14,3,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#ec9b32";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,46);ctx.lineTo(-22,58);ctx.moveTo(2,47);ctx.lineTo(8,58);ctx.stroke();ctx.restore()
}
function slothArt(x,y,baby){
 ctx.save();ctx.translate(x,y);const s=baby?.74:1;ctx.scale(s,s);ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(0,58,42,9,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#4b3b31";ctx.lineWidth=5;ctx.fillStyle="#a88a70";ctx.beginPath();ctx.ellipse(0,23,35,39,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#bea184";ctx.beginPath();ctx.ellipse(0,-4,27,25,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.strokeStyle="#6f5847";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-18,29);ctx.lineTo(-44,51);ctx.moveTo(18,29);ctx.lineTo(44,51);ctx.moveTo(-12,54);ctx.lineTo(-24,70);ctx.moveTo(12,54);ctx.lineTo(24,70);ctx.stroke();
 ctx.strokeStyle="#3b3029";ctx.lineWidth=3;for(const xx of [-44,44,-24,24]){ctx.beginPath();ctx.moveTo(xx,51);ctx.lineTo(xx+(xx<0?-10:10),58);ctx.stroke()}
 ctx.strokeStyle="#725e50";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,-13);ctx.quadraticCurveTo(-8,-23,0,-16);ctx.quadraticCurveTo(8,-23,16,-13);ctx.stroke();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-9,-5,3,0,Math.PI*2);ctx.arc(9,-5,3,0,Math.PI*2);ctx.fill();ctx.restore()
}
function entityArt(e){
 const x=e.x-camera;if(x<-160||x>viewW+160)return;const y=e.y;
 ctx.save();ctx.translate(0,0);
 if(e.id==="scanner")scannerArt(x,y);
 else if(e.id==="frog")frogArt(x,y);
 else if(e.id==="toucan")toucanArt(x,y);
 else if(e.id==="sloth")slothArt(x,y,false);
 else slothArt(x,y,true);
 if(!e.done){const pulse=52+Math.sin(time*4)*5;ctx.strokeStyle="rgba(255,244,111,.75)";ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y+6,pulse,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="rgba(101,255,157,.45)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+6,pulse+11,0,Math.PI*2);ctx.stroke()}
 ctx.restore()
}
function playerArt(){
 const x=player.x-camera,y=player.y,bob=player.onGround&&Math.abs(player.vx)>5?Math.sin(player.run)*3:0,leg=Math.sin(player.run)*12* (Math.abs(player.vx)>5&&player.onGround?1:0);
 ctx.save();ctx.translate(x+player.w/2,y+bob);ctx.scale(player.face,1);
 ctx.fillStyle="rgba(0,0,0,.24)";ctx.beginPath();ctx.ellipse(0,player.h+7,42,10,0,0,Math.PI*2);ctx.fill();
 // back pack
 ctx.fillStyle="#14384d";ctx.strokeStyle="#071920";ctx.lineWidth=5;round(-34,44,24,49,10);ctx.fill();ctx.stroke();ctx.fillStyle="#4fe0d0";round(-30,55,16,12,5);ctx.fill();
 // legs
 ctx.save();ctx.translate(-14,87);ctx.rotate(leg*Math.PI/180);ctx.fillStyle="#143c59";round(-10,0,20,38,9);ctx.fill();ctx.stroke();ctx.fillStyle="#0b263a";round(-13,30,26,16,8);ctx.fill();ctx.stroke();ctx.restore();
 ctx.save();ctx.translate(14,87);ctx.rotate(-leg*Math.PI/180);ctx.fillStyle="#143c59";round(-10,0,20,38,9);ctx.fill();ctx.stroke();ctx.fillStyle="#0b263a";round(-13,30,26,16,8);ctx.fill();ctx.stroke();ctx.restore();
 // torso
 let suit=ctx.createLinearGradient(-30,35,31,88);suit.addColorStop(0,"#1e86ad");suit.addColorStop(.5,"#155f88");suit.addColorStop(1,"#0c3d62");ctx.fillStyle=suit;round(-30,37,60,58,18);ctx.fill();ctx.stroke();
 ctx.fillStyle="#082736";round(-20,48,40,28,12);ctx.fill();ctx.stroke();ctx.fillStyle="#63ffe0";ctx.shadowColor="#63ffe0";ctx.shadowBlur=15;ctx.beginPath();ctx.arc(0,62,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.stroke();
 // arms
 ctx.strokeStyle="#0f3851";ctx.lineWidth=17;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-27,53);ctx.lineTo(-39,82);ctx.moveTo(27,53);ctx.lineTo(39,82);ctx.stroke();ctx.fillStyle="#6be7df";ctx.beginPath();ctx.arc(-40,84,9,0,Math.PI*2);ctx.arc(40,84,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#08202b";ctx.lineWidth=4;ctx.stroke();
 // head
 ctx.fillStyle="#d9a078";ctx.strokeStyle="#161b1c";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,22,27,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#38271f";ctx.beginPath();ctx.arc(-1,14,28,Math.PI,Math.PI*2);ctx.fill();
 // hair spikes
 ctx.fillStyle="#38271f";ctx.beginPath();ctx.moveTo(-21,8);ctx.lineTo(-16,-8);ctx.lineTo(-7,4);ctx.lineTo(1,-11);ctx.lineTo(7,5);ctx.lineTo(18,-5);ctx.lineTo(23,11);ctx.closePath();ctx.fill();
 // visor
 let vg=ctx.createLinearGradient(-20,14,20,30);vg.addColorStop(0,"#b8fff4");vg.addColorStop(.45,"#49e2de");vg.addColorStop(1,"#1b9db4");ctx.fillStyle=vg;round(-21,17,42,13,7);ctx.fill();ctx.stroke();ctx.fillStyle="rgba(255,255,255,.72)";round(-14,19,12,4,2);ctx.fill();
 ctx.restore()
}
function foreground(){
 if(atlas.complete&&atlas.naturalWidth){const a=AT.foliage;ctx.save();ctx.globalAlpha=.34;for(let x=-80;x<viewW+180;x+=210)ctx.drawImage(atlas,a[0],a[1],a[2],a[3],x,H-145,220,180);ctx.restore()}
 else{ctx.save();ctx.translate(-(camera*.72),0);for(let x=-90;x<LEVEL_W+150;x+=190){const yy=H-12;for(let i=0;i<5;i++)leaf(x+i*23,yy-(i%2)*22,48,20,-.9+i*.34,"#155c35","#2f8744")}ctx.restore()}
 for(const a of ambience){let x=(a.x-camera*.35+Math.sin(time+a.p)*22),y=a.y+Math.sin(time*.7+a.p)*10;if(x<-50||x>viewW+50)continue;ctx.globalAlpha=.22;leaf(x,y,12*a.s,5*a.s,time*.2+a.p,"#d8e86f","#66a94c");ctx.globalAlpha=1}
}
function interactionCue(){
 const e=nearEntity();if(!e||overlay.classList.contains("show"))return;const x=e.x-camera,y=e.y-76-Math.sin(time*4)*5;
 ctx.save();ctx.translate(x,y);ctx.fillStyle="#77ff8b";ctx.strokeStyle="#11351c";ctx.lineWidth=4;ctx.shadowColor="#67ff8d";ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-14,-5);ctx.lineTo(14,-5);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.restore()
}
function draw(){
 ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,viewW,H);
 sky();terrain();for(const e of entities)if(!e.done||e.type==="rescue")entityArt(e);playerArt();interactionCue();foreground()
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;time+=dt;physics(dt);draw();requestAnimationFrame(loop)}
function bind(id,start,end){const e=document.getElementById(id);for(const ev of ["touchstart","pointerdown"])e.addEventListener(ev,a=>{a.preventDefault();start()},{passive:false});for(const ev of ["touchend","touchcancel","pointerup","pointercancel"])e.addEventListener(ev,a=>{a.preventDefault();end&&end()},{passive:false})}
bind("left",()=>input.left=true,()=>input.left=false);bind("right",()=>input.right=true,()=>input.right=false);bind("up",jump,()=>{});bind("down",()=>input.down=true,()=>input.down=false);bind("action",action,()=>{});
document.getElementById("pause").onclick=()=>{
 const h=state.history,c=h.filter(x=>x.isCorrect).length,acc=h.length?Math.round(c/h.length*100):0;
 card.innerHTML='<h2>Parent / Pause</h2><p>First-attempt learning: <b>'+c+'/'+h.length+'</b>'+(h.length?' • '+acc+'%':'')+'</p><div class="choices"><button class="choice" id="resume">Resume</button></div>';
 overlay.classList.add("show");document.getElementById("resume").onclick=()=>overlay.classList.remove("show")
};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")input.left=true;if(e.key==="ArrowRight")input.right=true;if(e.key==="ArrowUp"||e.key===" "){e.preventDefault();jump()}if(e.key.toLowerCase()==="e")action()});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft")input.left=false;if(e.key==="ArrowRight")input.right=false});
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
