<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071812">
<title>Creature Quest Academy v6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#071812;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;background:#0d2a1d;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:20;display:flex;gap:9px;align-items:center;pointer-events:none}
.orb{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.88);background:rgba(4,73,57,.76);box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.22);display:grid;place-items:center}
#dataLights{height:54px;padding:0 12px;border-radius:28px;border:3px solid rgba(255,255,255,.88);background:rgba(4,73,57,.76);display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.light{width:24px;height:24px;border-radius:50%;border:3px solid #dcfff0;background:#103c36;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.light.on{background:radial-gradient(circle,#fff 0 15%,#6aff91 19% 57%,#169a55 61%);box-shadow:0 0 13px #5eff90,inset 0 0 0 3px rgba(0,0,0,.15)}
#pause{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:30;width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.88);background:rgba(4,73,57,.76);color:white;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#controls{position:fixed;inset:0;z-index:30;pointer-events:none}
#dpad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:158px;height:158px;border-radius:50%;background:rgba(3,38,45,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);pointer-events:none}
.dir{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.32);background:rgba(3,65,91,.55);color:#fff;font-size:24px;box-shadow:0 5px 14px rgba(0,0,0,.25);pointer-events:auto}
#up{left:51px;top:1px}#down{left:51px;bottom:1px}#left{left:1px;top:51px}#right{right:1px;top:51px}
#action{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;border:4px solid rgba(255,255,255,.42);background:radial-gradient(circle at 34% 25%,#d4ffac,#59ee69 48%,#199449);font-size:42px;color:#12351b;box-shadow:0 0 0 4px rgba(7,69,91,.32),0 8px 20px rgba(0,0,0,.32);pointer-events:auto}
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,13,16,.75);backdrop-filter:blur(5px)}
#overlay.show{display:flex}
.card{width:min(720px,100%);max-height:88vh;overflow:auto;padding:20px;border-radius:25px;background:#073f51;color:#fff;border:3px solid #d8fff0;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.card h2{margin:0 0 12px;font-size:clamp(24px,4vw,36px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:58px;border:3px solid #102025;border-radius:16px;background:#fff;color:#102025;font-weight:900;padding:10px}
.choice.good{background:#a2f6ac}.choice.bad{background:#ff9da8}
#dev{position:fixed;left:8px;bottom:7px;z-index:10;color:rgba(255,255,255,.48);font-size:9px;font-weight:800;pointer-events:none}
@media(max-width:700px){.choices{grid-template-columns:1fr}}
@media(orientation:portrait){#game::after{content:"Landscape works best";position:absolute;right:12px;bottom:10px;color:rgba(255,255,255,.38);font-size:10px}}
</style>
</head>
<body>
<div id="game"><canvas id="world"></canvas></div>
<div id="hud"><div class="orb">🐾</div><div id="dataLights"><i class="light"></i><i class="light"></i><i class="light"></i></div></div>
<button id="pause">Ⅱ</button>
<div id="controls"><div id="dpad"><button id="up" class="dir">↑</button><button id="down" class="dir">↓</button><button id="left" class="dir">←</button><button id="right" class="dir">→</button></div><button id="action">⚡</button></div>
<div id="overlay"><div id="card" class="card"></div></div>
<div id="dev">v6 foundation</div>
<script>
"use strict";
const canvas=document.getElementById("world"),ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay"),card=document.getElementById("card");
const LOGICAL={w:1280,h:720},LEVEL_W=4200,GROUND=600;
let scaleX=1,scaleY=1,last=performance.now(),camera=0;
const input={left:false,right:false,down:false};
const player={x:170,y:GROUND-105,w:62,h:105,vx:0,vy:0,speed:330,jump:690,onGround:false,face:1};
const state={data:0,mission:0,history:[]};
const platforms=[
 {x:0,y:GROUND,w:LEVEL_W,h:180},
 {x:720,y:510,w:220,h:90},{x:1040,y:455,w:230,h:110},{x:1370,y:520,w:240,h:100},
 {x:1710,y:450,w:230,h:120},{x:2080,y:395,w:210,h:130},{x:2410,y:475,w:260,h:110},
 {x:2800,y:410,w:235,h:115},{x:3150,y:345,w:250,h:135},{x:3550,y:435,w:250,h:120}
];
const entities=[
 {id:"scanner",x:470,y:GROUND-100,type:"scanner",done:false},
 {id:"frog",x:900,y:GROUND-70,type:"animal",done:false},
 {id:"toucan",x:1510,y:455,type:"animal",done:false},
 {id:"sloth",x:2230,y:330,type:"animal",done:false},
 {id:"baby",x:3720,y:365,type:"rescue",done:false}
];
const questions={
 scanner:{q:"Scanner reading: 347. Which digit is in the tens place?",a:"4",o:["3","4","7","0"],skill:"Place value: tens"},
 frog:{q:"Which word begins with wh?",a:"whale",o:["phone","whale","ring","cat"],skill:"Phonics: wh"},
 toucan:{q:"7 + 5 = ?",a:"12",o:["10","11","12","13"],skill:"Math facts: addition"},
 sloth:{q:"Which adaptation helps a sloth hang from branches?",a:"Long curved claws",o:["Long curved claws","Hooves","Fins","Feathers"],skill:"Reading: informational text"},
 baby:{q:"Which field note gives the most useful detail?",a:"The baby sloth is high in a leafy tree beside the waterfall.",o:["The sloth is there.","The baby sloth is high in a leafy tree beside the waterfall.","Sloth.","It is an animal."],skill:"Writing: add details"}
};
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);scaleX=canvas.width/LOGICAL.w;scaleY=canvas.height/LOGICAL.h}
addEventListener("resize",resize);resize();
function setData(n){state.data=n;document.querySelectorAll(".light").forEach((e,i)=>e.classList.toggle("on",i<n))}
function nearEntity(){let hit=null,dist=1e9;for(const e of entities){if(e.done)continue;const d=Math.abs((player.x+player.w/2)-e.x);if(d<dist){dist=d;hit=e}}return dist<120?hit:null}
function question(e){
 const q=questions[e.id],first={value:true};
 card.innerHTML='<h2>'+q.q+'</h2><div class="choices">'+q.o.map((v,i)=>'<button class="choice" data-i="'+i+'">'+v+'</button>').join("")+'</div>';
 overlay.classList.add("show");input.left=input.right=false;
 card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const s=q.o[+b.dataset.i],ok=s===q.a;if(first.value){state.history.push({time:new Date().toISOString(),skill:q.skill,question:q.q,selected:s,correctAnswer:q.a,isCorrect:ok});first.value=false}
 if(ok){b.classList.add("good");setTimeout(()=>{overlay.classList.remove("show");e.done=true;if(e.type==="animal")setData(Math.min(3,state.data+1));if(e.type==="rescue")celebrate()},450)}
 else{b.classList.add("bad");setTimeout(()=>{b.classList.remove("bad")},420)}
 });
}
function action(){if(overlay.classList.contains("show"))return;const e=nearEntity();if(e)question(e)}
function celebrate(){card.innerHTML='<h2>Rescue Complete!</h2><p>The baby sloth is safe. Your field data and learning helped finish the mission.</p><button class="choice" id="close">Keep Exploring</button>';overlay.classList.add("show");document.getElementById("close").onclick=()=>overlay.classList.remove("show")}
function physics(dt){if(overlay.classList.contains("show"))return;player.vx=(input.right?player.speed:0)-(input.left?player.speed:0);if(player.vx)player.face=Math.sign(player.vx);player.vy+=1600*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(0,Math.min(LEVEL_W-player.w,player.x));player.onGround=false;
 for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+46&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}}
 if(player.y>LOGICAL.h+300){player.x=170;player.y=GROUND-player.h;player.vy=0}
 const target=Math.max(0,Math.min(LEVEL_W-LOGICAL.w,player.x-LOGICAL.w*.36));camera+=(target-camera)*Math.min(1,dt*6.5)
}
function jump(){if(player.onGround&&!overlay.classList.contains("show")){player.vy=-player.jump;player.onGround=false}}
function sky(){
 let g=ctx.createLinearGradient(0,0,0,LOGICAL.h);g.addColorStop(0,"#77d8e3");g.addColorStop(.52,"#71bfa9");g.addColorStop(1,"#4c8754");ctx.fillStyle=g;ctx.fillRect(0,0,LOGICAL.w,LOGICAL.h);
 ctx.save();ctx.translate(-(camera*.08)%210,0);ctx.fillStyle="#77a95f";for(let x=-210;x<LOGICAL.w+420;x+=90){ctx.beginPath();ctx.arc(x,250,72,0,Math.PI*2);ctx.arc(x+50,275,58,0,Math.PI*2);ctx.fill()}ctx.restore();
 ctx.save();ctx.translate(-(camera*.18)%260,0);for(let x=-260;x<LOGICAL.w+520;x+=135){ctx.fillStyle="#385f3d";ctx.fillRect(x,265,34,LOGICAL.h-265);ctx.fillStyle="#356a40";ctx.beginPath();ctx.arc(x+20,275,95,0,Math.PI*2);ctx.fill()}ctx.restore()
}
function terrain(){
 ctx.save();ctx.translate(-camera,0);
 ctx.fillStyle="#704b31";ctx.fillRect(0,GROUND,LEVEL_W,150);ctx.fillStyle="#4bad3f";ctx.fillRect(0,GROUND-12,LEVEL_W,36);ctx.fillStyle="#96df51";ctx.fillRect(0,GROUND-12,LEVEL_W,8);
 for(const p of platforms.slice(1)){ctx.fillStyle="rgba(0,0,0,.16)";ctx.beginPath();ctx.ellipse(p.x+p.w/2,p.y+p.h,p.w*.48,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#755036";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle="#8d603e";ctx.fillRect(p.x+8,p.y+18,p.w-16,p.h-20);ctx.fillStyle="#51b63f";ctx.fillRect(p.x-5,p.y-10,p.w+10,24);ctx.fillStyle="#91df4a";ctx.fillRect(p.x,p.y-10,p.w,7)}
 ctx.restore()
}
function entityArt(e){
 const x=e.x-camera,y=e.y;if(x<-100||x>LOGICAL.w+100)return;
 ctx.save();ctx.translate(x,y);
 if(e.id==="scanner"){ctx.fillStyle="#0f4964";ctx.strokeStyle="#0d1a1e";ctx.lineWidth=5;round(-34,-4,68,88,13);ctx.fill();ctx.stroke();ctx.fillStyle="#54ff87";round(-19,14,38,28,7);ctx.fill();ctx.stroke()}
 else if(e.id==="frog"){ctx.fillStyle="#55d852";ctx.strokeStyle="#17301b";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,12,34,26,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-16,-7,12,0,Math.PI*2);ctx.arc(16,-7,12,0,Math.PI*2);ctx.fill();ctx.stroke()}
 else if(e.id==="toucan"){ctx.fillStyle="#202d39";ctx.strokeStyle="#111";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,14,28,34,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#ffd34b";ctx.beginPath();ctx.moveTo(13,-14);ctx.quadraticCurveTo(64,-24,50,6);ctx.quadraticCurveTo(30,20,11,5);ctx.closePath();ctx.fill();ctx.stroke()}
 else{ctx.fillStyle=e.id==="baby"?"#b99b7b":"#9f826b";ctx.strokeStyle="#4f4036";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,12,e.id==="baby"?26:32,e.id==="baby"?24:29,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-12,e.id==="baby"?20:23,0,Math.PI*2);ctx.fill();ctx.stroke()}
 if(!e.done){ctx.strokeStyle="rgba(255,247,116,.7)";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,48+Math.sin(performance.now()/190)*5,0,Math.PI*2);ctx.stroke()}
 ctx.restore()
}
function playerArt(){
 const x=player.x-camera,y=player.y;ctx.save();ctx.translate(x,y);
 ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(player.w/2,player.h+3,35,9,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#173642";ctx.lineWidth=14;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(23,66);ctx.lineTo(18,103);ctx.moveTo(40,66);ctx.lineTo(47,103);ctx.stroke();
 ctx.fillStyle="#177aa0";ctx.strokeStyle="#102229";ctx.lineWidth=5;round(8,32,50,47,15);ctx.fill();ctx.stroke();
 ctx.fillStyle="#d9a47b";ctx.beginPath();ctx.arc(33,22,22,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#2c211c";ctx.beginPath();ctx.arc(33,16,22,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle="#66f0dc";round(17,20,32,11,6);ctx.fill();ctx.stroke();
 ctx.restore()
}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(){ctx.setTransform(scaleX,0,0,scaleY,0,0);ctx.clearRect(0,0,LOGICAL.w,LOGICAL.h);sky();terrain();for(const e of entities)if(!e.done||e.type==="rescue")entityArt(e);playerArt()}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;physics(dt);draw();requestAnimationFrame(loop)}
function bind(id,start,end){const e=document.getElementById(id);for(const ev of ["touchstart","pointerdown"])e.addEventListener(ev,a=>{a.preventDefault();start()},{passive:false});for(const ev of ["touchend","touchcancel","pointerup","pointercancel"])e.addEventListener(ev,a=>{a.preventDefault();end&&end()},{passive:false})}
bind("left",()=>input.left=true,()=>input.left=false);bind("right",()=>input.right=true,()=>input.right=false);bind("up",jump,()=>{});bind("down",()=>input.down=true,()=>input.down=false);bind("action",action,()=>{});
document.getElementById("pause").onclick=()=>{card.innerHTML='<h2>Parent / Pause</h2><p>Learning data collected this session: '+state.history.length+' first attempts.</p><button class="choice" id="resume">Resume</button>';overlay.classList.add("show");document.getElementById("resume").onclick=()=>overlay.classList.remove("show")};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")input.left=true;if(e.key==="ArrowRight")input.right=true;if(e.key==="ArrowUp"||e.key===" "){e.preventDefault();jump()}if(e.key.toLowerCase()==="e")action()});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft")input.left=false;if(e.key==="ArrowRight")input.right=false});
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
